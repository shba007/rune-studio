name: Vue Release

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release:
    if: contains(github.event.head_commit.message, 'ci(release):')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract prepared changelog section
        run: node scripts/release-notes.mjs --out "$RUNNER_TEMP/release-notes.md"
      - name: Publish owner-prepared release
        shell: bash
        run: |
          version=$(bun -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "Release tag v$version already exists; prepare a new version." >&2
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{secrets.GH_TOKEN}}