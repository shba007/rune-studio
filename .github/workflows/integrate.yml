name: Vue CI
permissions:
  contents: read
on:
  push:
    branches: [develop]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x --no-install vp lint
      - run: bun x --no-install vp fmt --check src/
      - run: node --test scripts/release-notes.test.mjs
      - name: Preview prepared release notes
        run: node scripts/release-notes.mjs