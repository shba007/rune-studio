name: Vue CI

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - develop

jobs:
  rust:
    if: >
      !(
        contains(github.event.head_commit.message, 'ci(release):') ||
        contains(github.event.head_commit.message, '[skip ci]') ||
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        startsWith(github.event.head_commit.message, 'Merge branch')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            features: 'eval,agent-bridge'
          - platform: 'macos-latest'
            features: 'eval,agent-bridge'
          - platform: 'windows-latest'
            features: 'eval,agent-bridge,embedded-infer,embedded-kit'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7

      - name: Install OS Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf             libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev libegl1-mesa-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxdo-dev libasound2-dev

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 🛠️ Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: ✅ Test Code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features ${{ matrix.features }}

      - name: 🧹 Lint Code
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features ${{ matrix.features }} -- -D warnings

      - name: 🧼 Check Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check || echo "Formatting differs, but continuing"

  build:
    needs: rust
    if: >
      !(
        contains(github.event.head_commit.message, 'ci(release):') ||
        contains(github.event.head_commit.message, '[skip ci]') ||
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        startsWith(github.event.head_commit.message, 'Merge branch')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Build Artifact
        run: bun run build

      # - name: ✅ Test Code
      #   run: bun run test:unit

      - name: 🧹 Lint Code
        run: bun run lint || echo "Linting failed, but continuing"

      - name: 🧼 Format Code
        run: bun run format

      - name: 🤖 AutoFix Code
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: apply code fixes [skip ci]'

      - name: 🏷️ Bump Version
        id: bump_version
        run: |
          rm -f CHANGELOG.md
          bunx changelogen@latest --bump
          CHLOG=$(cat CHANGELOG.md)
          echo -e "CHANGELOG_CONTENT<<EOF\n${CHLOG}\nEOF" >> $GITHUB_ENV
          git reset --hard
          bunx changelogen@latest --bump

      - name: 🔀 Create or Update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'ci(release): update version'
          title: 'ci(release): update version'
          body: ${{ env.CHANGELOG_CONTENT }}
          branch: 'release/update-version'
          base: 'develop'
          delete-branch: true