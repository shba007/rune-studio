name: Vue CD
run-name: ${{ github.ref_name }}

permissions:
  contents: write

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REPO: ${{ github.repository }}
  VERSION: ${{ github.ref_name }}

jobs:
  build-desktop:
    env:
      PLATFORM_ENV: native

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --features agent-bridge'
            target: 'aarch64-apple-darwin'
            cli: 'rune-studio-cli'
            asset: 'macos_aarch64'

          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --features agent-bridge'
            target: 'x86_64-apple-darwin'
            cli: 'rune-studio-cli'
            asset: 'macos_x64'

          - platform: 'ubuntu-latest'
            args: '--features agent-bridge'
            target: ''
            cli: 'rune-studio-cli'
            asset: 'linux_x64'

          - platform: 'windows-latest'
            args: '--features agent-bridge,embedded-infer,embedded-kit'
            target: ''
            cli: 'rune-studio-cli.exe'
            asset: 'x64.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install OS Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev libegl1-mesa-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxdo-dev libasound2-dev

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🛠️ Setup Vite-Plus
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 'lts/*'
          cache: true

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Build and Upload Artifact
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: false
          prerelease: false

      - name: ⚙️ Upload CLI Artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="rune-studio-cli_${VERSION}_${{ matrix.asset }}"
          if [ -n "${{ matrix.target }}" ]; then dir="src-tauri/target/${{ matrix.target }}/release"; else dir="src-tauri/target/release"; fi
          cp "$dir/${{ matrix.cli }}" "$file"
          gh release upload "$VERSION" "$file" --clobber --repo "$REPO"

  build-mobile:
    env:
      ANDROID_HOME:
      PLATFORM_ENV: native

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            os: 'android'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install OS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        run: |
          sdkmanager "ndk;29.0.13846066"
          echo "NDK_HOME=${{ env.ANDROID_HOME }}/ndk/29.0.13846066" >> $GITHUB_ENV

      - name: Setup Android Signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > ./release-keystore.jks
          echo "storeFile=../release-keystore.jks" >> keystore.properties

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: ⚙️ Build Artifact
        run: bun run tauri:build:mobile

      - name: ⚙️ Upload Artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          asset_name: rune-studio_${{ env.VERSION }}_arm64.apk
          tag: ${{ env.VERSION }}

      - name: ⚙️ Upload Artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          asset_name: rune-studio_${{ env.VERSION }}_arm64.aab
          tag: ${{ env.VERSION }}