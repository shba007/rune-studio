name: Vue CD
run-name: ${{ github.ref_name }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
  pages: write

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REPO: ${{ github.repository }}
  VERSION: ${{ github.ref_name }}

jobs:
  build-desktop:
    env:
      PLATFORM_ENV: native
      NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --features agent-bridge'
            target: 'aarch64-apple-darwin'
            cli: 'rune-studio-cli'
            asset: 'macos_aarch64'

          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --features agent-bridge'
            target: 'x86_64-apple-darwin'
            cli: 'rune-studio-cli'
            asset: 'macos_x64'

          - platform: 'ubuntu-latest'
            args: '--features agent-bridge'
            target: ''
            cli: 'rune-studio-cli'
            asset: 'linux_x64'

          - platform: 'windows-latest'
            args: '--features agent-bridge,embedded-infer,embedded-kit'
            target: ''
            cli: 'rune-studio-cli.exe'
            asset: 'x64.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install OS Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgbm-dev libegl1-mesa-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxdo-dev libasound2-dev

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🛠️ Setup Vite-Plus
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 'lts/*'
          cache: true

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate exact prepared release body
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- verify-event

      - name: ⚙️ Build and Upload App Artifact
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ github.event.release.id }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false

      - name: ⚙️ Build and Upload CLI Artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="rune-studio-cli_${VERSION}_${{ matrix.asset }}"
          if [ -n "${{ matrix.target }}" ]; then dir="src-tauri/target/${{ matrix.target }}/release"; else dir="src-tauri/target/release"; fi
          cp "$dir/${{ matrix.cli }}" "$file"
          gh release upload "$VERSION" "$file" --clobber --repo "$REPO"