<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rune eval: popup</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        margin: 2rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Cookie banner test</h1>
    <p><button id="go">Continue</button></p>
    <div
      id="banner"
      style="
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      <div style="background: #fff; padding: 2rem; border-radius: 8px">
        <p>We use cookies.</p>
        <button id="close">Accept and close</button>
      </div>
    </div>
    <script>
      const run = new URLSearchParams(location.search).get('run') || 'norun'
      const ok = (what) => {
        document.title = 'RUNE-OK ' + run + ' ' + what
      }
      document.getElementById('close').addEventListener('click', () => {
        document.getElementById('banner').remove()
      })
      document.getElementById('go').addEventListener('click', () => {
        if (!document.getElementById('banner')) ok('popup')
      })
    </script>
  </body>
</html>
