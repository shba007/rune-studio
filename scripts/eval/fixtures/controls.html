<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rune eval: controls</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        margin: 2rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Controls test</h1>
    <p>
      <label><input type="checkbox" id="tick" /> Tick me</label>
    </p>
    <p>
      <label
        >Colour
        <select id="colour">
          <option>Red</option>
          <option>Green</option>
          <option>Blue</option>
        </select></label
      >
    </p>
    <script>
      const run = new URLSearchParams(location.search).get('run') || 'norun'
      const ok = (what) => {
        document.title = 'RUNE-OK ' + run + ' ' + what
      }
      const tick = document.getElementById('tick')
      const colour = document.getElementById('colour')
      const update = () => {
        if (tick.checked && colour.value === 'Blue') ok('controls blue checked')
      }
      tick.addEventListener('change', update)
      colour.addEventListener('change', update)
    </script>
  </body>
</html>
