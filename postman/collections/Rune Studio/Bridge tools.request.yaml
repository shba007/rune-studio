$kind: http-request
id: 502dc5f074c0ef7b4e5b5901
name: Bridge tools
method: POST
url: '{{studio_url}}/mcp'
body:
  type: json
  content: '{"jsonrpc":"2.0","method":"tools/list","id":"Bridge tools","params":{}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{studio_token}}'
scripts:
  - type: afterResponse
    code: pm.test("JSON-RPC envelope", () => { pm.response.to.have.status(200); const r = pm.response.json(); pm.expect(r.jsonrpc).to.eql("2.0"); pm.expect(r.id).to.eql("Bridge tools"); }); pm.test("RPC success", () => pm.expect(pm.response.json()).not.to.have.property("error"));pm.test("Discover safe inspection tools", () => { const names = pm.response.json().result.tools.map(t => t.name); pm.expect(names).to.include("rune_guide"); pm.expect(names).to.include("rune_begin"); });
    language: text/javascript
