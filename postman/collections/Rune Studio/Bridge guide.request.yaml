$kind: http-request
id: b53995ad9508247de35fafd7
name: Bridge guide
method: POST
url: '{{studio_url}}/mcp'
body:
  type: json
  content: '{"jsonrpc":"2.0","method":"resources/read","id":"Bridge guide","params":{"uri":"rune://guide"}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{studio_token}}'
scripts:
  - type: afterResponse
    code: pm.test("JSON-RPC envelope", () => { pm.response.to.have.status(200); const r = pm.response.json(); pm.expect(r.jsonrpc).to.eql("2.0"); pm.expect(r.id).to.eql("Bridge guide"); }); pm.test("RPC success", () => pm.expect(pm.response.json()).not.to.have.property("error"));pm.test("Agent guide", () => { pm.expect(pm.response.json().result.contents[0].mimeType).to.eql("text/markdown"); });
    language: text/javascript