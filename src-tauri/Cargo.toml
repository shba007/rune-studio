[package]
name = "rune-studio"
description = "Voice and text driven desktop agent that controls the PC through rune-infer"
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/shba007/rune-studio.git"
edition = "2024"
rust-version = "1.98.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# Lets an outside agent drive Rune Studio's eyes and hands over a local MCP server. Off by default.
agent-bridge = ["dep:axum", "dep:getrandom"]

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
getrandom = { version = "0.3", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-log = "2.10"
tauri-plugin-process = "2.4"
tauri-plugin-global-shortcut = "2"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
keyring = "4"
cpal = "0.18"
xcap = "0.9"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "rt", "net"] }

[dev-dependencies]
# The M1.5 probe loads its scene screenshots from PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Foundation",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"

# Screenshot downscaling and JPEG encoding are ~15x slower unoptimised (generic image code is
# compiled into this crate), which would make every dev-build capture take about a second.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rune-studio]
opt-level = 1

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }