[package]
name = "rune-studio"
version = "0.6.0"
description = "Voice and text driven desktop agent that controls the PC through rune-infer"
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/shba007/rune-studio.git"
edition = "2024"
default-run = "rune-studio"
rust-version = "1.98.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The windowed app. Windows starts a program like this without a console, so it cannot be a
# command-line tool: that is the job of the second binary below.
[[bin]]
name = "rune-studio"
path = "src/main.rs"

# The `rune-studio-cli` command: a console program (so a terminal waits for it and shows its output)
# that opens the app, connects agents and answers `status`. Only in agent-bridge builds.
[[bin]]
name = "rune-studio-cli"
path = "src/bin/rune-studio-cli.rs"
required-features = ["agent-bridge"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
agent-bridge = ["dep:axum"]
# The evaluation harness (docs/ARCHITECTURE.md, "The evaluation harness"). Never in a release build.
eval = []
# Pin the embedded Infer implementation so clean checkouts resolve it reproducibly.
embedded-infer = ["dep:rune-infer"]

[dependencies]
rune-infer = { git = "https://github.com/shba007/rune-infer.git", rev = "81f9e47030b6e9169086dcbf08219449b7d80df4", default-features = false, features = [
  "cpu",
], optional = true }
dirs = "7"
axum = { version = "0.8", optional = true, default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
getrandom = "0.4"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2.10"
tauri-plugin-process = "2.4"
tauri-plugin-global-shortcut = "2.4"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
keyring = "4.2"
cpal = "0.18"
xcap = "0.9"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23"
thiserror = "2.0"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tokio = { version = "1.54", features = ["time", "macros", "rt", "net", "sync"] }
aes-gcm = "0.11.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-autostart = "2.7.0"
rawler = "=0.8.0"
png = "=0.18.1"
tempfile = "3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows = { version = "0.62", features = [
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_Storage_FileSystem",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Foundation",
  "Win32_Security",
  # The session video (video/encode.rs): the Media Foundation H.264 sink writer, no extra binary.
  "Win32_Media",
  "Win32_Media_MediaFoundation",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-single-instance = "2.5"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rawler]
opt-level = 3

[profile.dev.package.rune-studio]
opt-level = 1

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }