[package]
name = "rune-studio"
description = "Vue + Typescript + Tailwind + Tauri Template"
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/shba007/rune-studio.git"
edition = "2024"
rust-version = "1.98.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2.9"
tauri-plugin-process = "2.3"
walkdir = "2.5"
rfd = "0.17.2"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dotenvy = "0.15.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.12"