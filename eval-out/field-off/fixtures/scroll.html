<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rune eval: scroll</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        margin: 2rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <h1>A long list</h1>
    <ul id="list" style="list-style: none; padding: 0"></ul>
    <script>
      const run = new URLSearchParams(location.search).get('run') || 'norun'
      const ok = (what) => {
        document.title = 'RUNE-OK ' + run + ' ' + what
      }
      const list = document.getElementById('list')
      for (let n = 1; n <= 60; n++) {
        const li = document.createElement('li')
        li.textContent = 'Target ' + n
        li.style.cssText = 'padding:14px;border-bottom:1px solid #ccc;cursor:pointer'
        li.addEventListener('click', () => {
          if (n === 42) ok('scroll 42')
        })
        list.appendChild(li)
      }
    </script>
  </body>
</html>
