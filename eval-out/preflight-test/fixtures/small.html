<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rune eval: small</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        margin: 2rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Small target test</h1>
    <p>Click the small square.</p>
    <button
      id="go"
      aria-label="small button"
      style="
        width: 16px;
        height: 16px;
        padding: 0;
        margin: 3rem 0 0 14rem;
        border: 1px solid #444;
        background: #c33;
      "
    ></button>
    <script>
      const run = new URLSearchParams(location.search).get('run') || 'norun'
      const ok = (what) => {
        document.title = 'RUNE-OK ' + run + ' ' + what
      }
      document.getElementById('go').addEventListener('click', () => ok('small'))
    </script>
  </body>
</html>
